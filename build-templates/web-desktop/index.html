<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Cocos Creator | DanceRevolution</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>
    
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    
    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <div id="GameDiv" cc_exact_fit_screen="false" style="width: 1920px; height: 911px;">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1920" height="911" tabindex="99"></canvas>
      </div>
    </div>
    <!-- Polyfills bundle. -->
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

<script>
  // 畫面保持比例
  let resizeTimer = null;

  function safeFixCocosSize() {
    const cc = window.cc;
    if (!cc || !cc.view) return;

    // 取得當前真實尺寸
    const width = document.documentElement.clientWidth || window.innerWidth;
    const height = document.documentElement.clientHeight || window.innerHeight;

    // 核心防護：尺寸異常（如轉向過渡期的 0）時拒絕更新，防止 WebGL 崩潰
    if (width <= 0 || height <= 0) return;

    // 設定尺寸並通知引擎
    cc.view.setFrameSize(width, height);
    if (typeof cc.view._adjustViewport === 'function') {
      cc.view._adjustViewport();
    }
  }

  function handleResize() {
    // 清除舊的定時器（防抖），避免連續翻轉時密集觸發 setFrameSize
    if (resizeTimer) clearTimeout(resizeTimer);

    // 等待轉向動畫與工具列穩定後（250ms）才執行一次
    resizeTimer = setTimeout(() => {
      safeFixCocosSize();
    }, 250);
  }

  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', handleResize);
</script>

<script>
  // 防護：當 WebGL Context 丟失時嘗試讓瀏覽器重繪
  const canvas = document.getElementById('GameCanvas');
  if (canvas) {
    canvas.addEventListener('webglcontextlost', (event) => {
      event.preventDefault();
      console.warn('WebGL Context Lost. Attempting to restore...');
    }, false);

    canvas.addEventListener('webglcontextrestored', () => {
      console.log('WebGL Context Restored.');
      if (window.cc && window.cc.view) {
        window.cc.view.setFrameSize(
          document.documentElement.clientWidth,
          document.documentElement.clientHeight
        );
      }
    }, false);
  }
</script>

<script>
  // 阻止瀏覽器預設的下拉刷新與手勢攔截
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    // 阻止頁面滾動與下拉刷新，讓所有 Touch 完全交給 Cocos Canvas
    e.preventDefault();
  }, { passive: false });
</script>

  </body>
</html>
