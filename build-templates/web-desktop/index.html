<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Cocos Creator | DanceRevolution</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>
    
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    
    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <div id="GameDiv" cc_exact_fit_screen="false" style="width: 1920px; height: 911px;">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1920" height="911" tabindex="99"></canvas>
      </div>
    </div>
    <!-- Polyfills bundle. -->
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

<script>
  // 畫面保持比例
  function fixCocosInputScale() {
    const cc = window.cc;
    if (cc && cc.view) {
      const width = document.documentElement.clientWidth || window.innerWidth;
      const height = document.documentElement.clientHeight || window.innerHeight;
      
      // 強制設定 Frame Size
      cc.view.setFrameSize(width, height);
      
      // 強制 Cocos 重新計算 Canvas 與 DOM 的縮放比例矩陣
      if (typeof cc.view._adjustViewport === 'function') {
        cc.view._adjustViewport();
      }
      
      // 觸發原生 resize 事件，逼使 EditBox 的 DOM 重新計算位置
      window.dispatchEvent(new Event('resize'));
    }
  }

  // 監聽視窗變化
  window.addEventListener('resize', () => {
    setTimeout(fixCocosInputScale, 100);
    setTimeout(fixCocosInputScale, 300); // 延遲確保動畫完成
  });
  
  window.addEventListener('orientationchange', () => {
    setTimeout(fixCocosInputScale, 300);
    setTimeout(fixCocosInputScale, 600);
  });
</script>

  </body>
</html>
